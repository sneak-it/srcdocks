name: Release to Docker

on:
  release:
    types: [published]
  push:
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and Push ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: watchdog
            dockerfile: watchdog/Dockerfile
          - image: server
            dockerfile: srcds/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/sneak-it/srcdocks
          flavor: latest=false
          tags: |
            type=raw,value=${{ matrix.image }},enable=${{ github.event_name == 'release' }}
            type=raw,value=${{ matrix.image }}-${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && matrix.image == 'watchdog' }}
            type=raw,value=${{ matrix.image }}-develop,enable=${{ github.event_name == 'push' }}

      - name: Build and push ${{ matrix.image }} image
        uses: docker/build-push-action@v7.3.0
        with:
          # Both Dockerfiles COPY from ./srcds and ./watchdog, so the context must be the repo root.
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: true
          sbom: true
